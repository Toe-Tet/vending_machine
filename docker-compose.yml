services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-vending}
      DB_USER: ${DB_USER:-vending}
      DB_PASSWORD: ${DB_PASSWORD:-vending}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vending}
      MYSQL_USER: ${DB_USER:-vending}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vending}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:

# Render Blueprint: one free Docker web service; MySQL lives on Aiven (ADR-0004).
# No secrets here. Values marked `sync: false` are asked for in the Render
# dashboard when the Blueprint is first applied; JWT_SECRET is generated by Render.
# The image's entrypoint runs bin/migrate (schema + seed) and then Apache on $PORT.
services:
  - type: web
    name: vending-machine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /products
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false # e.g. https://vending-machine.onrender.com
      - key: DB_HOST
        sync: false # Aiven service host
      - key: DB_PORT
        sync: false # Aiven service port
      - key: DB_NAME
        sync: false # e.g. defaultdb
      - key: DB_USER
        sync: false # e.g. avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false # /etc/secrets/ca.pem (Secret File), or the PEM contents themselves
      - key: JWT_SECRET
        generateValue: true # random value from Render; production needs >= 32 chars (Config.php)
